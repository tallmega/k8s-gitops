apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-kevin-config
  namespace: openclaw-kevin
  labels:
    app: openclaw-kevin
data:
  # First-boot seed only: cluster plumbing (ingress, auth, pairing URL, sandbox SSH).
  # Model, tools, plugins, skills and AGENTS.md are managed by OpenClaw and its user on the volume.
  # ${VAR} is substituted by OpenClaw at load time from the pod environment.
  openclaw.json: |
    {
      "gateway": {
        "mode": "local",
        "bind": "lan",
        "port": 18789,
        "auth": {
          "mode": "token",
          "token": "${OPENCLAW_GATEWAY_TOKEN}"
        },
        "publicOrigin": "https://claw-kevin.tallflix.ca",
        "trustedProxies": [
          "10.244.0.0/16"
        ],
        "controlUi": {
          "enabled": true,
          "allowedOrigins": [
            "https://claw-kevin.tallflix.ca"
          ]
        }
      },
      "agents": {
        "defaults": {
          "sandbox": {
            "mode": "all",
            "scope": "agent",
            "backend": "ssh",
            "ssh": {
              "target": "sandbox@openclaw-kevin-sandbox:2222",
              "workspaceRoot": "/sandbox/workspaces",
              "identityFile": "/home/node/.openclaw/ssh/id_ed25519",
              "knownHostsFile": "/home/node/.openclaw/ssh/known_hosts",
              "strictHostKeyChecking": true
            }
          }
        }
      },
      "plugins": {
        "entries": {
          "device-pair": {
            "config": {
              "publicUrl": "wss://claw-kevin.tallflix.ca"
            }
          }
        }
      }
    }
  # Pinned sandbox host key in known_hosts format ("openclaw-kevin-sandbox ssh-ed25519 AAAA...").
  # Empty means the init container trusts the key it sees on first boot (ssh-keyscan).
  sandbox_known_hosts: |
    [openclaw-kevin-sandbox]:2222 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMlED679+pSH+ZpERrb/BTi2QGovelhMb5Wm4IA4I579
