# OpenClaw gateway for Kyrie. One cell per person: own namespace, secrets,
# sandbox pod and network policy. The ConfigMap seeds openclaw.json on first boot;
# afterwards the copy on the volume is UI-editable (see OPENCLAW_CONFIG_OVERWRITE).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw-kyrie
  namespace: openclaw-kyrie
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openclaw-kyrie
  strategy:
    rollingUpdate: null
    type: Recreate
  template:
    metadata:
      labels:
        app: openclaw-kyrie
    spec:
      automountServiceAccountToken: false
      # OpenClaw drains sessions for up to ~5.5 min on shutdown and holds an owner lease
      # on the state volume; killing it early leaves a stale lease that blocks the next start.
      terminationGracePeriodSeconds: 360
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      # Longhorn hands over the volume root owned by root; the gateway chmods its state
      # directory on config writes, which needs ownership. Chown the mount root once.
      - name: fix-perms
        image: ghcr.io/openclaw/openclaw:2026.9.5-browser # {"$imagepolicy": "flux-system:openclaw"}
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-ec", "chown 1000:1000 /home/node/.openclaw /home/node/.openclaw/workspace && chmod 2770 /home/node/.openclaw && chmod 2775 /home/node/.openclaw/workspace"]
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          runAsNonRoot: false
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
            add:
            - CHOWN
            - FOWNER
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
        volumeMounts:
        - name: state
          mountPath: /home/node/.openclaw
        - name: workspace
          mountPath: /home/node/.openclaw/workspace
      - name: seed-config
        image: ghcr.io/openclaw/openclaw:2026.9.5-browser # {"$imagepolicy": "flux-system:openclaw"}
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-ec"]
        args:
        - |
          STATE=/home/node/.openclaw
          mkdir -p "$STATE/workspace" "$STATE/ssh"
          # Fail fast on a broken ConfigMap instead of booting a gateway with defaults.
          node -e 'JSON.parse(require("fs").readFileSync("/seed/openclaw.json","utf8"))'
          # Config ownership: the ConfigMap seeds openclaw.json on first boot only; after
          # that the copy on the volume is the source of truth and the Control UI may edit
          # it. Set OPENCLAW_CONFIG_OVERWRITE=true to force a re-seed from git.
          if [ "${OPENCLAW_CONFIG_OVERWRITE:-false}" = "true" ] || [ ! -f "$STATE/openclaw.json" ]; then
            rm -f "$STATE/openclaw.json"
            cp /seed/openclaw.json "$STATE/openclaw.json"
            chmod 600 "$STATE/openclaw.json"
            echo "openclaw.json written from ConfigMap"
          else
            echo "openclaw.json exists on volume; left untouched (UI-owned)"
          fi
          rm -f "$STATE/ssh/known_hosts"
          # Sandbox host key: pinned value from the ConfigMap when present, otherwise
          # trust-on-first-boot via ssh-keyscan (pin it once the sandbox is stable).
          if [ -s /seed/sandbox_known_hosts ]; then
            cp /seed/sandbox_known_hosts "$STATE/ssh/known_hosts"
            echo "known_hosts pinned from ConfigMap"
          else
            i=0
            until ssh-keyscan -p 2222 -T 5 openclaw-kyrie-sandbox > "$STATE/ssh/known_hosts" 2>/dev/null && [ -s "$STATE/ssh/known_hosts" ]; do
              i=$((i+1)); [ $i -ge 24 ] && { echo "WARNING: sandbox not reachable, known_hosts left empty"; break; }
              sleep 5
            done
            echo "known_hosts from ssh-keyscan ($(wc -l < "$STATE/ssh/known_hosts") keys)"
          fi
          chmod 700 "$STATE/ssh"
        env:
        - name: HOME
          value: /home/node
        - name: OPENCLAW_CONFIG_DIR
          value: /home/node/.openclaw
        - name: OPENCLAW_CONFIG_OVERWRITE
          value: "false"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: "1"
            memory: 1Gi
        volumeMounts:
        - name: state
          mountPath: /home/node/.openclaw
        - name: workspace
          mountPath: /home/node/.openclaw/workspace
        - name: seed
          mountPath: /seed
          readOnly: true
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /home/node/.cache
      containers:
      - name: openclaw
        image: ghcr.io/openclaw/openclaw:2026.9.5-browser # {"$imagepolicy": "flux-system:openclaw"}
        imagePullPolicy: IfNotPresent
        command:
        - node
        - /app/dist/index.js
        - gateway
        - run
        ports:
        - name: gateway
          containerPort: 18789
          protocol: TCP
        env:
        - name: TZ
          value: America/Toronto
        - name: HOME
          value: /home/node
        - name: OPENCLAW_CONFIG_DIR
          value: /home/node/.openclaw
        - name: NODE_ENV
          value: production
        - name: npm_config_cache
          value: /tmp/npm-cache
        - name: OPENCLAW_GATEWAY_TOKEN
          valueFrom:
            secretKeyRef:
              name: openclaw-kyrie-secrets
              key: OPENCLAW_GATEWAY_TOKEN
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: openclaw-kyrie-secrets
              key: ANTHROPIC_API_KEY
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: openclaw-kyrie-secrets
              key: OPENAI_API_KEY
        - name: BRAVE_API_KEY
          valueFrom:
            secretKeyRef:
              name: openclaw-kyrie-secrets
              key: BRAVE_API_KEY
        # Probes assert the JSON probe contract, not just the status code: the
        # Control UI answers 200 for unknown paths.
        startupProbe:
          exec:
            command:
            - node
            - -e
            - "require('http').get('http://127.0.0.1:18789/startupz', r => { let b = ''; r.on('data', d => b += d); r.on('end', () => { try { process.exit(r.statusCode < 400 && JSON.parse(b).ok !== false ? 0 : 1); } catch { process.exit(1); } }); }).on('error', () => process.exit(1))"
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
        readinessProbe:
          exec:
            command:
            - node
            - -e
            - "require('http').get('http://127.0.0.1:18789/readyz', r => { let b = ''; r.on('data', d => b += d); r.on('end', () => { try { process.exit(r.statusCode < 400 && JSON.parse(b).ready === true ? 0 : 1); } catch { process.exit(1); } }); }).on('error', () => process.exit(1))"
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          exec:
            command:
            - node
            - -e
            - "require('http').get('http://127.0.0.1:18789/healthz', r => { let b = ''; r.on('data', d => b += d); r.on('end', () => { try { process.exit(r.statusCode < 400 && JSON.parse(b).ok === true ? 0 : 1); } catch { process.exit(1); } }); }).on('error', () => process.exit(1))"
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        resources:
          requests:
            cpu: 250m
            memory: 1Gi
          limits:
            cpu: "2"
            memory: 4Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: state
          mountPath: /home/node/.openclaw
        - name: sandbox-key
          mountPath: /home/node/.openclaw/ssh/id_ed25519
          subPath: SANDBOX_SSH_KEY
          readOnly: true
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /home/node/.cache
        - name: codex
          mountPath: /home/node/.codex
        # Shared with the sandbox pod so the Control UI and the agent see one workspace.
        - name: workspace
          mountPath: /home/node/.openclaw/workspace
      volumes:
      - name: state
        persistentVolumeClaim:
          claimName: openclaw-kyrie-pvc
      - name: seed
        configMap:
          name: openclaw-kyrie-config
          defaultMode: 0444
      - name: sandbox-key
        secret:
          secretName: openclaw-kyrie-secrets
          defaultMode: 0400
          items:
          - key: SANDBOX_SSH_KEY
            path: SANDBOX_SSH_KEY
      - name: tmp
        emptyDir:
          sizeLimit: 2Gi
      - name: cache
        emptyDir:
          sizeLimit: 2Gi
      - name: codex
        emptyDir:
          sizeLimit: 1Gi
      - name: workspace
        persistentVolumeClaim:
          claimName: openclaw-kyrie-workspace-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: openclaw-kyrie
  namespace: openclaw-kyrie
  labels:
    app: openclaw-kyrie
spec:
  selector:
    app: openclaw-kyrie
  ports:
  - name: gateway
    port: 18789
    targetPort: 18789
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openclaw-kyrie-pvc
  namespace: openclaw-kyrie
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 20Gi
---
# Agent workspace shared by the gateway (Control UI file view, memory) and the sandbox
# (where the agent's exec/file tools actually run). Longhorn RWX (share-manager NFS).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openclaw-kyrie-workspace-pvc
  namespace: openclaw-kyrie
spec:
  accessModes:
  - ReadWriteMany
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
