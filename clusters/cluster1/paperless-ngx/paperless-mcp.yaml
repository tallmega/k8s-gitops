---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  creationTimestamp: null
  name: paperless-apikey
  namespace: default
spec:
  encryptedData:
    PAPERLESS_API_KEY: 
  template:
    metadata:
      creationTimestamp: null
      name: paperless-apikey
      namespace: default
    type: Opaque
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless-mcp
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paperless-mcp
  template:
    metadata:
      labels:
        app: paperless-mcp
    spec:
      containers:
        - name: paperless-mcp
          image: ghcr.io/baruchiro/paperless-mcp:2.2.1 # {"$imagepolicy": "flux-system:paperless-mcp"}
          # v2+ rejects requests without a client token; --no-auth keeps anonymous clients working
          # by falling back to PAPERLESS_API_KEY, which must be a VIEW-ONLY Paperless user's token
          # (the endpoint is reachable on the LAN via the internal route).
          args: ["--no-auth"]
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          env:
            - name: PAPERLESS_URL
              value: https://paperless.tallflix.ca
            - name: PAPERLESS_PUBLIC_URL
              value: https://paperless.tallflix.ca
            - name: PAPERLESS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: paperless-apikey
                  key: PAPERLESS_API_KEY
---
apiVersion: v1
kind: Service
metadata:
  name: paperless-mcp
  namespace: default
  labels:
    app: paperless-mcp
spec:
  selector:
    app: paperless-mcp
  ports:
  - name: paperless-mcp
    port: 3000
    targetPort: 3000
  type: ClusterIP