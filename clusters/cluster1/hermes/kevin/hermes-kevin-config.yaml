apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-kevin-seed
  namespace: hermes-kevin
data:
  # Runs as the hermes UID before the gateway starts. Installs the gog Google CLI binary
  # onto the data volume (latest release, checksum-verified, cached copy if GitHub is unreachable)
  # and seeds workspace skills only when missing: after first boot, skills on the volume
  # belong to Kevin and the agent. HERMES_SEED_OVERWRITE=true forces a re-seed.
  seed.sh: |
    #!/bin/sh
    set -eu
    D=/opt/data
    mkdir -p "$D/.local/lib/gog" "$D/gog" "$D/skills"
    TOOLS="$D/.local/lib/gog"
    TAG=$(curl -fsSL --max-time 20 https://api.github.com/repos/openclaw/gogcli/releases/latest 2>/dev/null \
      | sed -n 's/.*"tag_name": *"\([^"]*\)".*/\1/p' | head -1 || true)
    if [ -n "$TAG" ]; then
      VER=${TAG#v}
      TGZ="$TOOLS/gogcli_${VER}_linux_amd64.tar.gz"
      if [ ! -f "$TGZ" ]; then
        BASE="https://github.com/openclaw/gogcli/releases/download/${TAG}"
        curl -fsSL --max-time 120 -o "$TGZ.part" "$BASE/gogcli_${VER}_linux_amd64.tar.gz"
        SHA=$(curl -fsSL --max-time 30 "$BASE/checksums.txt" | awk '/linux_amd64.tar.gz/{print $1}')
        echo "$SHA  $TGZ.part" | sha256sum -c - >/dev/null && mv "$TGZ.part" "$TGZ"
        ls -1t "$TOOLS"/gogcli_*_linux_amd64.tar.gz | tail -n +3 | xargs -r rm -f
      fi
    else
      TGZ=$(ls -1t "$TOOLS"/gogcli_*_linux_amd64.tar.gz 2>/dev/null | head -1 || true)
      [ -n "$TGZ" ] && echo "[gog] GitHub unreachable, using cached $TGZ"
    fi
    if [ -n "${TGZ:-}" ]; then
      rm -rf /tmp/gog && mkdir -p /tmp/gog && tar -xzf "$TGZ" -C /tmp/gog
      install -m 0755 /tmp/gog/gog "$TOOLS/gog.bin"
      # The keyring passphrase file is read by the gog wrapper (key gog-wrapper below).
      printf '%s' "${GOG_KEYRING_PASSWORD:-}" > "$D/gog/.keyring-pass"
      chmod 700 "$D/gog" && chmod 600 "$D/gog/.keyring-pass"
      rm -f "$D/.local/bin/gog"
      echo "[gog] installed $("$TOOLS/gog.bin" --version 2>/dev/null | head -1)"
    else
      echo "[gog] no network and no cached release; skipping"
    fi
    for s in /seed/skills/*; do
      name=$(basename "$s" .md)
      dest="$D/skills/productivity/$name/SKILL.md"
      if [ ! -f "$dest" ] || [ "${HERMES_SEED_OVERWRITE:-false}" = true ]; then
        mkdir -p "$(dirname "$dest")" && cp "$s" "$dest" && echo "[seed] skill $name"
      fi
    done
  # Mounted at /usr/local/bin/gog: the agent's terminal runs a login shell whose
  # /etc/profile resets PATH to the system dirs, so the wrapper must live there.
  gog-wrapper: |
    #!/bin/sh
    export GOG_HOME=/opt/data/gog
    export GOG_KEYRING_BACKEND=file
    export GOG_KEYRING_PASSWORD="$(cat /opt/data/gog/.keyring-pass 2>/dev/null)"
    exec /opt/data/.local/lib/gog/gog.bin "$@"
  google-readonly.md: |
    ---
    name: google-readonly
    description: Read Kevin's Gmail and Google Calendar (kmcbride@gmail.com) with the gog CLI. Read-only - use this instead of the google-workspace skill.
    ---
    # Google (read-only) via gog

    `gog` is on PATH and already authorized for kmcbride@gmail.com with **read-only**
    Gmail and Calendar scopes. Run it directly; do not look for credentials, do not run
    `gog auth`, and do not use the bundled google-workspace skill (it requests write scopes).

    - Search mail with Gmail query syntax: `gog gmail search 'newer_than:2d is:unread'`
    - Discover the rest from the CLI itself: `gog --help`, `gog gmail --help`,
      `gog calendar --help` (subcommand flags change between releases).

    Sending, replying, archiving, labelling and creating or changing events are **not
    possible** (the token has no write scopes). When Kevin wants an email sent or an event
    created, draft the text or event details in chat and let him do it himself.

    Kevin's wife Kyrie's invites go to kyrie.hillier@gmail.com.
