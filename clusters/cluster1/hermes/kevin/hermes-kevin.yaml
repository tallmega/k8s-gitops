# Hermes Agent (Nous Research) for Kevin. One cell per person: own namespace, secrets,
# volume and network policy. Tools run locally in the hermes container (terminal
# backend "local"); the network policy is the boundary. The container starts as root
# under s6-overlay, which chowns the volume and drops the gateway and dashboard to the
# hermes user (UID 10000); only the capabilities that needs are granted. config.yaml,
# SOUL.md, memories and skills on the volume are owned by Kevin and the agent (edit
# them in the dashboard), not by git.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-kevin
  namespace: hermes-kevin
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hermes-kevin
  strategy:
    rollingUpdate: null
    type: Recreate
  template:
    metadata:
      labels:
        app: hermes-kevin
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: seed
        image: docker.io/nousresearch/hermes-agent:v2026.9.24 # {"$imagepolicy": "flux-system:hermes-agent"}
        command: ["/bin/sh", "/seed/seed.sh"]
        env:
        - name: GOG_KEYRING_PASSWORD
          valueFrom:
            secretKeyRef:
              name: hermes-kevin-secrets
              key: GOG_KEYRING_PASSWORD
        securityContext:
          runAsUser: 10000
          runAsGroup: 10000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: data
          mountPath: /opt/data
        - name: seed
          mountPath: /seed
          readOnly: true
        - name: tmp
          mountPath: /tmp
      containers:
      - name: hermes
        image: docker.io/nousresearch/hermes-agent:v2026.9.24 # {"$imagepolicy": "flux-system:hermes-agent"}
        args: ["gateway", "run"]
        ports:
        - name: http
          containerPort: 9119
          protocol: TCP
        env:
        - name: TZ
          value: America/Toronto
        # s6 supervises the dashboard next to the gateway (same PID namespace, so the
        # dashboard can see and manage the gateway process).
        - name: HERMES_DASHBOARD
          value: "1"
        - name: HERMES_DASHBOARD_PUBLIC_URL
          value: https://hermes-kevin.tallflix.ca
        # Authentik public (PKCE) client; Hermes does not support a client secret yet.
        - name: HERMES_DASHBOARD_OIDC_ISSUER
          value: https://sso.tallflix.ca/application/o/hermes-kevin/
        - name: HERMES_DASHBOARD_OIDC_CLIENT_ID
          value: hermes-kevin
        - name: HERMES_DASHBOARD_OIDC_SCOPES
          value: openid profile email offline_access
        - name: HASS_URL
          value: http://home-assistant.default.svc.cluster.local:8123
        - name: OBSIDIAN_VAULT_PATH
          value: /vault
        - name: HASS_TOKEN
          valueFrom:
            secretKeyRef:
              name: hermes-kevin-secrets
              key: HASS_TOKEN
        - name: BRAVE_SEARCH_API_KEY
          valueFrom:
            secretKeyRef:
              name: hermes-kevin-secrets
              key: BRAVE_SEARCH_API_KEY
        # Telegram stays off until the bot token is sealed in (see seal.sh).
        - name: TELEGRAM_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: hermes-kevin-secrets
              key: TELEGRAM_BOT_TOKEN
              optional: true
        - name: TELEGRAM_ALLOWED_USERS
          valueFrom:
            secretKeyRef:
              name: hermes-kevin-secrets
              key: TELEGRAM_ALLOWED_USERS
              optional: true
        - name: TELEGRAM_HOME_CHANNEL
          valueFrom:
            secretKeyRef:
              name: hermes-kevin-secrets
              key: TELEGRAM_ALLOWED_USERS
              optional: true
        readinessProbe:
          tcpSocket:
            port: 9119
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 1Gi
          limits:
            cpu: "2"
            memory: 4Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add:
            - CHOWN
            - DAC_OVERRIDE
            - FOWNER
            - SETUID
            - SETGID
            - KILL
        volumeMounts:
        - name: data
          mountPath: /opt/data
        # Obsidian vault exported by the vault-sync sidecar; read-only for the agent.
        - name: vault
          mountPath: /vault
          readOnly: true
      # One-way exporter: rebuilds the plaintext Obsidian LiveSync vault from CouchDB
      # (scoped read-only user) into the shared emptyDir every 15 min.
      - name: vault-sync
        image: docker.io/library/python:3.13-slim
        imagePullPolicy: IfNotPresent
        command: ["python3", "/app/sync.py"]
        env:
        - name: TZ
          value: America/Toronto
        - name: COUCHDB_URL
          value: http://obsidian-livesync-couchdb.default.svc.cluster.local:5984/obsidian
        - name: OUT_DIR
          value: /vault
        - name: INTERVAL
          value: "900"
        - name: VAULT_COUCHDB_USER
          valueFrom:
            secretKeyRef:
              name: hermes-kevin-secrets
              key: VAULT_COUCHDB_USER
        - name: VAULT_COUCHDB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: hermes-kevin-secrets
              key: VAULT_COUCHDB_PASSWORD
        resources:
          requests:
            cpu: 25m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          runAsUser: 10000
          runAsGroup: 10000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: vault-sync
          mountPath: /app
          readOnly: true
        - name: vault
          mountPath: /vault
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: hermes-kevin-pvc
      - name: seed
        configMap:
          name: hermes-kevin-seed
          defaultMode: 0444
          items:
          - key: seed.sh
            path: seed.sh
          - key: gog-wrapper
            path: gog-wrapper
      - name: vault-sync
        configMap:
          name: hermes-kevin-vault-sync
          defaultMode: 0444
      - name: vault
        emptyDir:
          sizeLimit: 2Gi
      - name: tmp
        emptyDir:
          sizeLimit: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-kevin
  namespace: hermes-kevin
  labels:
    app: hermes-kevin
spec:
  selector:
    app: hermes-kevin
  ports:
  - name: http
    port: 9119
    targetPort: 9119
  type: ClusterIP
---
# SQLite (state.db, WAL) lives here, so block storage only (no RWX/NFS).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-kevin-pvc
  namespace: hermes-kevin
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 20Gi
