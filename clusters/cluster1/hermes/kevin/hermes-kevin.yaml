# Hermes Agent (Nous Research) for Kevin. One cell per person: own namespace, secrets,
# volume and network policy. Tools run locally in the hermes container (terminal
# backend "local"); the network policy is the boundary. The container starts as root
# under s6-overlay, which chowns the volume and drops the gateway and dashboard to the
# hermes user (UID 10000); only the capabilities that needs are granted. config.yaml,
# SOUL.md, memories and skills on the volume are owned by Kevin and the agent (edit
# them in the dashboard), not by git.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-kevin
  namespace: hermes-kevin
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hermes-kevin
  strategy:
    rollingUpdate: null
    type: Recreate
  template:
    metadata:
      labels:
        app: hermes-kevin
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: seed
        image: docker.io/nousresearch/hermes-agent:v2026.9.24 # {"$imagepolicy": "flux-system:hermes-agent"}
        command: ["/bin/sh", "/seed/seed.sh"]
        env:
        - name: GOG_KEYRING_PASSWORD
          valueFrom:
            secretKeyRef:
              name: hermes-kevin-secrets
              key: GOG_KEYRING_PASSWORD
        securityContext:
          runAsUser: 10000
          runAsGroup: 10000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: data
          mountPath: /opt/data
        - name: seed
          mountPath: /seed
          readOnly: true
        - name: tmp
          mountPath: /tmp
      # TEMPORARY (remove once ghcr.io/asamk/signal-cli >= 0.14.9 is running): builds
      # signal-cli from a pinned master commit for numberless-account recovery
      # (--recovery-key, AsamK/signal-cli dac64f7), which no release has yet. Cached on the
      # signal volume per commit, so only the first start builds. To undo: delete this init
      # container, the SIGNAL_CLI_COMMIT env on signal-cli, and /signal/build on the volume.
      - name: signal-cli-build
        image: docker.io/library/gradle:9.8.0-jdk25-noble
        command:
        - /bin/sh
        - -c
        - |
          set -eu
          OUT="/signal/build/$SIGNAL_CLI_COMMIT"
          if [ -x "$OUT/bin/signal-cli" ]; then echo "[signal-build] cached $SIGNAL_CLI_COMMIT"; exit 0; fi
          git clone --quiet https://github.com/AsamK/signal-cli.git /tmp/src
          git -C /tmp/src checkout --quiet "$SIGNAL_CLI_COMMIT"
          cd /tmp/src && gradle --no-daemon --quiet installDist
          rm -rf /signal/build && mkdir -p /signal/build && cp -a build/install/signal-cli "$OUT"
          echo "[signal-build] built $("$OUT/bin/signal-cli" --version)"
        env:
        - name: SIGNAL_CLI_COMMIT
          value: 13d603d3b5898d7b3b527305afc23c9c7ba84c5b
        - name: HOME
          value: /tmp
        - name: GRADLE_USER_HOME
          value: /tmp/gradle
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: "2"
            memory: 3Gi
        securityContext:
          runAsUser: 10000
          runAsGroup: 10000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: signal
          mountPath: /signal
        - name: signal-build-tmp
          mountPath: /tmp
      # Signal for Hermes: the bot's own numberless account. Its keys live on a separate volume
      # the hermes container does not mount. Native sidecar (restartPolicy: Always): it is
      # running and probed before hermes starts and stops after hermes, so the gateway never
      # races its startup or loses sends on shutdown. receive-mode=on-connection: messages are
      # only pulled from Signal while Hermes is listening, so none are dropped during restarts.
      # Listens on the pod IP for the startup probe; the network policy admits no other client.
      # Uses the image's own signal-cli once it is >= 0.14.9 (image policy bumps it), otherwise
      # the build above.
      - name: signal-cli
        restartPolicy: Always
        image: ghcr.io/asamk/signal-cli:0.14.8 # {"$imagepolicy": "flux-system:signal-cli"}
        command:
        - /bin/sh
        - -c
        - |
          set -eu
          CFG=/signal/data
          OFFICIAL=$(/opt/signal-cli/bin/signal-cli --version 2>/dev/null | awk '{print $2}')
          if [ "$(printf '0.14.9\n%s\n' "$OFFICIAL" | sort -V | head -1)" = "0.14.9" ]; then
            BIN=/opt/signal-cli/bin/signal-cli
          else
            BIN="/signal/build/$SIGNAL_CLI_COMMIT/bin/signal-cli"  # TEMPORARY
          fi
          echo "$BIN" > /tmp/signal-bin
          echo "[signal] using $("$BIN" --version)"
          until [ -n "$("$BIN" --config="$CFG" listAccounts 2>/dev/null)" ]; do
            echo "[signal] waiting for a registered account (run the register step)"; sleep 60
          done
          # No -a: serves every registered account; Hermes names its account per request.
          exec "$BIN" --config="$CFG" daemon --http=0.0.0.0:8080 --receive-mode=on-connection
        env:
        - name: SIGNAL_CLI_COMMIT  # TEMPORARY
          value: 13d603d3b5898d7b3b527305afc23c9c7ba84c5b
        - name: JAVA_OPTS
          value: -Xmx384m
        startupProbe:
          tcpSocket:
            port: 8080
          periodSeconds: 5
          failureThreshold: 120
        resources:
          requests:
            cpu: 25m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 768Mi
        securityContext:
          runAsUser: 10000
          runAsGroup: 10000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: signal
          mountPath: /signal
        - name: signal-tmp
          mountPath: /tmp
      containers:
      - name: hermes
        image: docker.io/nousresearch/hermes-agent:v2026.9.24 # {"$imagepolicy": "flux-system:hermes-agent"}
        args: ["gateway", "run"]
        ports:
        - name: http
          containerPort: 9119
          protocol: TCP
        env:
        - name: TZ
          value: America/Toronto
        # s6 supervises the dashboard next to the gateway (same PID namespace, so the
        # dashboard can see and manage the gateway process).
        - name: HERMES_DASHBOARD
          value: "1"
        - name: HERMES_DASHBOARD_PUBLIC_URL
          value: https://hermes-kevin.tallflix.ca
        # Authentik public (PKCE) client; Hermes does not support a client secret yet.
        - name: HERMES_DASHBOARD_OIDC_ISSUER
          value: https://sso.tallflix.ca/application/o/hermes-kevin/
        - name: HERMES_DASHBOARD_OIDC_CLIENT_ID
          value: hermes-kevin
        - name: HERMES_DASHBOARD_OIDC_SCOPES
          value: openid profile email offline_access
        - name: HASS_URL
          value: http://home-assistant.default.svc.cluster.local:8123
        - name: OBSIDIAN_VAULT_PATH
          value: /vault
        # Browser tool (agent-browser -> headless Chromium). Chromium's own sandbox needs user
        # namespaces, which the RuntimeDefault seccomp profile blocks ("No usable sandbox!");
        # the locked-down container and network policy are the sandbox instead. /dev/shm is
        # only 64Mi, so Chromium uses /tmp for shared memory.
        - name: AGENT_BROWSER_ARGS
          value: --no-sandbox,--disable-dev-shm-usage
        - name: HASS_TOKEN
          valueFrom:
            secretKeyRef:
              name: hermes-kevin-secrets
              key: HASS_TOKEN
        - name: BRAVE_SEARCH_API_KEY
          valueFrom:
            secretKeyRef:
              name: hermes-kevin-secrets
              key: BRAVE_SEARCH_API_KEY
        # Signal bridge: the signal-cli sidecar (localhost only). Account and allowed users
        # are set in the dashboard (Messaging > Signal), stored in Hermes' own .env.
        - name: SIGNAL_HTTP_URL
          value: http://127.0.0.1:8080
        readinessProbe:
          tcpSocket:
            port: 9119
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 1Gi
          limits:
            cpu: "2"
            memory: 4Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add:
            - CHOWN
            - DAC_OVERRIDE
            - FOWNER
            - SETUID
            - SETGID
            - KILL
        volumeMounts:
        - name: data
          mountPath: /opt/data
        # Obsidian vault exported by the vault-sync sidecar; read-only for the agent.
        - name: vault
          mountPath: /vault
          readOnly: true
      # One-way exporter: rebuilds the plaintext Obsidian LiveSync vault from CouchDB
      # (scoped read-only user) into the shared emptyDir every 15 min.
      - name: vault-sync
        image: docker.io/library/python:3.13-slim
        imagePullPolicy: IfNotPresent
        command: ["python3", "/app/sync.py"]
        env:
        - name: TZ
          value: America/Toronto
        - name: COUCHDB_URL
          value: http://obsidian-livesync-couchdb.default.svc.cluster.local:5984/obsidian
        - name: OUT_DIR
          value: /vault
        - name: INTERVAL
          value: "900"
        - name: VAULT_COUCHDB_USER
          valueFrom:
            secretKeyRef:
              name: hermes-kevin-secrets
              key: VAULT_COUCHDB_USER
        - name: VAULT_COUCHDB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: hermes-kevin-secrets
              key: VAULT_COUCHDB_PASSWORD
        resources:
          requests:
            cpu: 25m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          runAsUser: 10000
          runAsGroup: 10000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: vault-sync
          mountPath: /app
          readOnly: true
        - name: vault
          mountPath: /vault
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: hermes-kevin-pvc
      - name: seed
        configMap:
          name: hermes-kevin-seed
          defaultMode: 0444
          items:
          - key: seed.sh
            path: seed.sh
          - key: gog-wrapper
            path: gog-wrapper
      - name: vault-sync
        configMap:
          name: hermes-kevin-vault-sync
          defaultMode: 0444
      - name: vault
        emptyDir:
          sizeLimit: 2Gi
      - name: tmp
        emptyDir:
          sizeLimit: 512Mi
      - name: signal
        persistentVolumeClaim:
          claimName: hermes-kevin-signal-pvc
      - name: signal-tmp
        emptyDir:
          sizeLimit: 256Mi
      - name: signal-build-tmp  # TEMPORARY (signal-cli-build)
        emptyDir:
          sizeLimit: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-kevin
  namespace: hermes-kevin
  labels:
    app: hermes-kevin
spec:
  selector:
    app: hermes-kevin
  ports:
  - name: http
    port: 9119
    targetPort: 9119
  type: ClusterIP
---
# SQLite (state.db, WAL) lives here, so block storage only (no RWX/NFS).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-kevin-pvc
  namespace: hermes-kevin
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 20Gi
---
# signal-cli account keys and message store for the bot's Signal account. Mounted only in
# the signal-cli containers, never in hermes, so the agent cannot read the keys.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-kevin-signal-pvc
  namespace: hermes-kevin
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
