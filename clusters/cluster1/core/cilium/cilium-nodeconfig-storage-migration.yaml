---
# Cilium 1.20 removes v2alpha1 from the CiliumNodeConfig CRD. The cluster has
# no CiliumNodeConfig objects, so v2alpha1 can safely be removed from the CRD's
# storedVersions before Helm applies the updated CRD.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cilium-nodeconfig-storage-migration
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cilium-nodeconfig-storage-migration
rules:
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
      - customresourcedefinitions/status
    resourceNames:
      - ciliumnodeconfigs.cilium.io
    verbs:
      - get
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cilium-nodeconfig-storage-migration
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cilium-nodeconfig-storage-migration
subjects:
  - kind: ServiceAccount
    name: cilium-nodeconfig-storage-migration
    namespace: kube-system
---
apiVersion: batch/v1
kind: Job
metadata:
  name: cilium-nodeconfig-storage-migration
  namespace: kube-system
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: cilium-nodeconfig-storage-migration
      restartPolicy: OnFailure
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate-stored-version
          image: registry.k8s.io/kubectl:v1.32.0
          imagePullPolicy: IfNotPresent
          command:
            - kubectl
            - patch
            - customresourcedefinition
            - ciliumnodeconfigs.cilium.io
            - --subresource=status
            - --type=merge
            - -p
            - '{"status":{"storedVersions":["v2"]}}'
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
