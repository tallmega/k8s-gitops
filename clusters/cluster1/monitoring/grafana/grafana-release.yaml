apiVersion: v1
kind: Namespace
metadata:
  name: grafana
  labels:
    managed-by: flux
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-k8s-monitoring
  namespace: grafana
spec:
  chart:
    spec:
      chart: k8s-monitoring
      version: "^1"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  interval: 1m
  valuesFrom:
    - kind: Secret
      name: graphanacloud-secret
      valuesKey: token
      targetPath: externalServices.prometheus.basicAuth.password
    - kind: Secret
      name: graphanacloud-secret
      valuesKey: token
      targetPath: externalServices.loki.basicAuth.password
    - kind: Secret
      name: graphanacloud-secret
      valuesKey: token
      targetPath: externalServices.tempo.basicAuth.password
  install:
    createNamespace: true
    remediation:
      retries: 3
  values:
    cluster:
      name: cluster1
    externalServices:
      prometheus:
        host: https://prometheus-prod-32-prod-ca-east-0.grafana.net
        basicAuth:
          username: "1065506"
      loki:
        host: https://logs-prod-018.grafana.net
        basicAuth:
          username: "634358"
      tempo:
        host: https://tempo-prod-13-prod-ca-east-0.grafana.net:443
        basicAuth:
          username: "630862"
    metrics:
      enabled: true
      alloy:
        metricsTuning:
          useIntegrationAllowList: false
      cost:
        enabled: false
      kepler:
        enabled: false
      # Grafana Cloud free tier caps at 10k active series; entries below are regexes
      cadvisor:
        metricsTuning:
          excludeMetrics:
            - container_network_.*_packets.*
            - container_fs_(reads|writes)_total
            - container_memory_(cache|swap)
      kubelet:
        metricsTuning:
          excludeMetrics:
            - kubelet_.*_duration_seconds_bucket
            - kubelet_runtime_operations_total
            - kubelet_volume_stats_inodes.*
            - rest_client_requests_total
            - storage_operation_duration_seconds_count
      kube-state-metrics:
        metricsTuning:
          excludeMetrics:
            - kube_deployment_metadata_generation
            - kube_deployment_status_condition
            - kube_deployment_status_observed_generation
            - kube_persistentvolume_status_phase
            - kube_persistentvolumeclaim_access_mode
            - kube_persistentvolumeclaim_status_phase
            - kube_pod_container_info
            - kube_pod_container_status_last_terminated_timestamp
            - kube_pod_info
            - kube_pod_init_container_.*
            - kube_pod_restart_policy
            - kube_pod_spec_volumes_persistentvolumeclaims_info
            - kube_pod_start_time
            - kube_pod_status_reason
      node-exporter:
        enabled: true
        metricsTuning:
          excludeMetrics:
            - node_cpu_(guest_seconds|core_throttles|package_throttles)_total
            - node_cpu_(frequency|scaling)_.*
            - node_filesystem_(device_error|readonly|mount_info)
            - node_network_(receive|transmit)_drop_total
        # Per-pod kubelet mounts and veth/cilium interfaces churn with every pod restart
        extraMetricRelabelingRules: |-
          rule {
            source_labels = ["__name__", "mountpoint"]
            separator = "@"
            regex = "node_filesystem_.*@/var/lib/kubelet/.*"
            action = "drop"
          }
          rule {
            source_labels = ["__name__", "device"]
            separator = "@"
            regex = "node_network_.*@(lo|lxc.*|cilium_.*|tunl.*|teql.*|sit.*|ip6tnl.*|dummy.*)"
            action = "drop"
          }
    logs:
      enabled: true
      pod_logs:
        enabled: true
      cluster_events:
        enabled: true
    traces:
      enabled: true
    receivers:
      grpc:
        enabled: true
      http:
        enabled: true
      zipkin:
        enabled: true
      grafanaCloudMetrics:
        enabled: false
    opencost:
      enabled: false
      opencost:
        exporter:
          defaultClusterId: cluster1
        prometheus:
          external:
            url: https://prometheus-prod-32-prod-ca-east-0.grafana.net/api/prom
    kube-state-metrics:
      enabled: true
      collectors:
        - cronjobs
        - daemonsets
        - deployments
        - horizontalpodautoscalers
        - ingresses
        - jobs
        - namespaces
        - nodes
        - persistentvolumeclaims
        - pods
        - services
        - statefulsets
        - storageclasses
    prometheus-node-exporter:
      enabled: true
    prometheus-operator-crds:
      enabled: true
    kepler:
      enabled: false
    alloy: {}
    alloy-events: {}
    alloy-logs: {}
